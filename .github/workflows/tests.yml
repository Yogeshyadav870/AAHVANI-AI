name: AAHVANI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core and Live dependencies
        run: python -m pip install -r requirements-live.txt
      - name: Smoke-test app and Live handler imports
        env:
          GEMINI_API_KEY: ci-smoke-test-key
        run: python -c "import app; import live_voice; print('AAHVANI app and Gemini Live handler imported successfully')"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
